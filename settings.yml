# SearXNG settings til Railway-deployment
use_default_settings: true

general:
  debug: false
  instance_name: "Nordlys Search"

server:
  secret_key: "nordlys-internal-searxng-session-key-2026"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

engines:
  # ✅ Virker på Railway-IP
  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  # ❌ CAPTCHA-blokeret på Railway — deaktiveret for at undgå log-spam og spildt tid
  - name: google
    engine: google
    shortcut: g
    disabled: true

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: true

  - name: brave
    engine: brave
    shortcut: br
    disabled: true

ui:
  static_use_hash: true
  default_theme: simple

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
