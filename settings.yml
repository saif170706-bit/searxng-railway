# SearXNG settings til Railway-deployment
use_default_settings: true

general:
  debug: false
  instance_name: "Nordlys Search"

server:
  # secret_key sættes IKKE her — det officielle startup-script
  # auto-genererer en fra $SEARXNG_SECRET env var (eller laver en selv)
  limiter: false          # Ingen rate-limit — vi er eneste bruger
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json                # PÅKRÆVET — vores leadfinder bruger ?format=json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

ui:
  static_use_hash: true
  default_theme: simple

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
