# SearXNG settings til Railway-deployment
use_default_settings: true

general:
  debug: false
  instance_name: "Nordlys Search"

server:
  # Placeholder erstattes ved container-startup fra $SEARXNG_SECRET_KEY (Railway Variable)
  secret_key: "REPLACE_SECRET_KEY_AT_RUNTIME"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

ui:
  static_use_hash: true
  default_theme: simple

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
