# SearXNG settings til Railway-deployment
# Dokumentation: https://docs.searxng.org/admin/settings/index.html
use_default_settings: true

general:
  debug: false
  instance_name: "Nordlys Search"

server:
  # Sæt SEARXNG_SECRET_KEY som Railway-variabel — brug en lang tilfældig streng
  # Generer med: openssl rand -hex 32
  secret_key: "${SEARXNG_SECRET_KEY}"
  limiter: false          # Ingen rate-limit — vi er eneste bruger
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json                # PÅKRÆVET — vores leadfinder bruger ?format=json

# Aktiver de motorer vi vil trække resultater fra
# SearXNG bruger alle som standard — fjern dem du ikke vil have
engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

ui:
  static_use_hash: true
  default_theme: simple

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  # Valgfrit: tilføj proxies her hvis du løber ind i blokering
  # proxies:
  #   all://: socks5://127.0.0.1:1080
